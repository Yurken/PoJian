name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'dev/**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/*android-signing*'
      - 'scripts/verify-apk-signing.py'
      - 'scripts/tests/test_android_signing.py'
      - 'scripts/apk_delta.py'
      - 'scripts/publish_r2.py'
      - 'scripts/tests/test_r2_updates.py'
      - 'scripts/publish_public_apk.py'
      - 'scripts/tests/test_public_apk.py'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_plan
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          RELEASE_TAG="v${VERSION}"
          TAG_REFS="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          if [ -z "$TAG_REFS" ]; then
            echo "No existing ${RELEASE_TAG}; building artifacts without Release publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG_COMMIT="$(printf '%s\n' "$TAG_REFS" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [ -z "$TAG_COMMIT" ]; then
            TAG_COMMIT="$(printf '%s\n' "$TAG_REFS" | awk 'NR == 1 { print $1 }')"
          fi
          if [ "$TAG_COMMIT" != "$RELEASE_SHA" ]; then
            echo "::error::${RELEASE_TAG} does not point to this commit; refusing Release publication."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Test release publishers
        run: |
          python3 -m unittest discover -s scripts/tests -p test_r2_updates.py
          python3 -m unittest discover -s scripts/tests -p test_public_apk.py

      - name: Check public release credentials
        if: steps.release_plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.APK_RELEASE_TOKEN }}
          APK_RELEASE_REPOSITORY: ${{ vars.APK_RELEASE_REPOSITORY || 'baijiamin/PoJian-Releases' }}
        run: python3 scripts/publish_public_apk.py --check

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Restore fixed signing identity
        env:
          POJIAN_SIGNING_KEYSTORE_BASE64: ${{ secrets.POJIAN_SIGNING_KEYSTORE_BASE64 }}
          POJIAN_SIGNING_STORE_PASSWORD: ${{ secrets.POJIAN_SIGNING_STORE_PASSWORD }}
          POJIAN_SIGNING_KEY_ALIAS: ${{ secrets.POJIAN_SIGNING_KEY_ALIAS }}
          POJIAN_SIGNING_KEY_PASSWORD: ${{ secrets.POJIAN_SIGNING_KEY_PASSWORD }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_android_signing.py
          python3 scripts/prepare-android-signing.py "$RUNNER_TEMP/pojian-signing"
          echo "POJIAN_SIGNING_PROPERTIES=$RUNNER_TEMP/pojian-signing/keystore.properties" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_pojian.serviceToken: ${{ secrets.POJIAN_SERVICE_TOKEN }}
          APK_RELEASE_REPOSITORY: ${{ vars.APK_RELEASE_REPOSITORY || 'baijiamin/PoJian-Releases' }}
        run: |
          python3 -c 'import os, sys; sys.exit(0 if os.environ.get("ORG_GRADLE_PROJECT_pojian.serviceToken") else "POJIAN_SERVICE_TOKEN is missing")'
          PYTHONPATH=scripts python3 -c 'import os; from publish_public_apk import validate_repo; validate_repo(os.environ["APK_RELEASE_REPOSITORY"])'
          bash ./gradlew :app:assembleRelease --no-daemon --console=plain \
            "-Ppojian.apkReleaseRepository=${APK_RELEASE_REPOSITORY}"

      - name: Verify APK signature
        run: |
          python3 scripts/verify-apk-signing.py \
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            app/build/outputs/apk/release/app-release.apk app/signing-certificate.sha256

      - name: Remove temporary signing files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/pojian-signing"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoJian-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Prepare release assets
        if: steps.release_plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release_plan.outputs.version }}
          VERSION_CODE: ${{ steps.release_plan.outputs.version_code }}
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/PoJian.apk
          APK_SHA256="$(sha256sum release-apk/PoJian.apk | awk '{print $1}')"
          printf '{"version":1,"version_code":%s,"version_name":"%s","sha256":"%s"}\n' \
            "$VERSION_CODE" "$VERSION" "$APK_SHA256" > release-apk/update.json

      - name: Publish APK and incremental update to public repository
        if: steps.release_plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.APK_RELEASE_TOKEN }}
          APK_RELEASE_REPOSITORY: ${{ vars.APK_RELEASE_REPOSITORY || 'baijiamin/PoJian-Releases' }}
        run: python3 scripts/publish_public_apk.py

      - name: Publish APK to source repository Releases
        if: steps.release_plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.release_plan.outputs.version }}
          RELEASE_TAG: ${{ steps.release_plan.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/PoJian.apk release-apk/update.json --clobber
          else
            gh release create "$RELEASE_TAG" release-apk/PoJian.apk release-apk/update.json \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "破茧 v${VERSION}" \
              --notes "使用项目固定签名的 Release APK，本地与 CI 共用同一签名。固定签名版本之间支持覆盖升级。此前临时 Debug 签名版本不兼容，请保留旧应用及数据，完成备份迁移前不要卸载。" \
              --latest
          fi

  cleanup:
    needs: apk
    if: github.ref == 'refs/heads/main' && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prune stale Gradle caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          IDS=$(gh api "repos/{owner}/{repo}/actions/caches?per_page=100" \
            --jq '[.actions_caches[]
                   | {id, created_at, family: (.key | sub("-[0-9a-f]{16,}.*$"; ""))}]
                  | group_by(.family)
                  | map(sort_by(.created_at) | reverse | .[1:])
                  | flatten
                  | map(.id)')
          echo "Stale cache ids: $IDS"
          for id in $(echo "$IDS" | jq -r '.[]'); do
            gh api -X DELETE "repos/{owner}/{repo}/actions/caches/$id" --silent
            echo "Deleted cache $id"
          done
