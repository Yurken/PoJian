<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>破茧图标 v6</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#eef2f8;display:grid;place-items:center;min-height:100vh}
main{width:100%;max-width:1100px;padding:64px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{min-height:484px;border-radius:32px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px}
.card.dark{background:#142039}.large{width:248px;height:248px}.sizes{display:flex;align-items:center;gap:24px;height:64px}
.sizes img{display:block}.floating{opacity:.72}
@media(max-width:650px){main{padding:24px;gap:20px;grid-template-columns:1fr}.card{min-height:410px}}
</style></head>
<body><main>
<div class="card"><img class="large" src="pojian-logo-v6.svg" alt=""><div class="sizes"><img src="pojian-logo-v6.svg" width="64" height="64" alt=""><img src="pojian-logo-v6.svg" width="48" height="48" alt=""><img src="pojian-logo-v6.svg" width="32" height="32" alt=""><img src="pojian-logo-v6.svg" width="26" height="26" alt=""></div></div>
<div class="card dark"><img class="large" src="pojian-bubble-v6.svg" alt=""><div class="sizes"><img class="floating" src="pojian-bubble-v6.svg" width="56" height="56" alt=""><img class="floating" src="pojian-bubble-v6.svg" width="44" height="44" alt=""><img class="floating" src="pojian-bubble-v6.svg" width="32" height="32" alt=""><img class="floating" src="pojian-bubble-v6.svg" width="24" height="24" alt=""></div></div>
</main></body></html>
