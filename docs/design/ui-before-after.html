<body>
<header>
  <div class="eyebrow">破茧 / DESIGN REVIEW</div>
  <h1>UI 前后对比</h1>
  <p>依据本轮 Compose 改动还原，非真机截图。两侧使用相同示例数据；茧房图形为简化示意。</p>
  <div class="toolbar">
    <nav class="scene-tabs" aria-label="对比场景">
      <button type="button" data-scene="empty" aria-pressed="true">首次使用</button>
      <button type="button" data-scene="overview" aria-pressed="false">概览</button>
      <button type="button" data-scene="settings" aria-pressed="false">采集与数据</button>
      <button type="button" data-scene="trend" aria-pressed="false">趋势与搜索</button>
      <button type="button" data-scene="refresh" aria-pressed="false">词云刷新</button>
      <button type="button" data-scene="discovery" aria-pressed="false">发现</button>
    </nav>
    <button class="utility" id="theme" type="button" aria-pressed="false">深色预览</button>
  </div>
</header>
<main class="workspace">
  <div class="note"><p id="scene-note"></p><div class="note-actions"><select class="utility permission-state" id="permission-state" aria-label="系统授权状态" hidden><option value="missing">未授权</option><option value="connected" selected>已连接</option><option value="disconnected">连接异常</option></select><button class="utility" id="jump-permission" type="button" hidden>定位授权项</button><button class="utility" id="jump" type="button" hidden>定位监测控件</button><button class="utility" id="jump-more" type="button" hidden>定位更多</button><button class="utility" id="jump-storage" type="button" hidden>定位存储</button><button class="utility" id="refresh" type="button" hidden>模拟同范围刷新</button></div></div>
  <div class="comparison">
    <section aria-label="优化前"><div class="version-label"><strong>优化前</strong><span>本轮修改前</span></div><div class="phone before" id="before"></div></section>
    <section aria-label="优化后"><div class="version-label"><strong>优化后</strong><span>当前工作区</span></div><div class="phone after" id="after"></div></section>
  </div>
</main>
<footer><span id="detail-note"></span><span>页面截取相关区域 · 文案沿用现有内容</span></footer>
<script>
(() => {
  'use strict';
  const $ = (s, root=document) => root.querySelector(s);
  const $$ = (s, root=document) => [...root.querySelectorAll(s)];
  const state={scene:'empty',dark:false,selected:6,refreshing:false,category:'全部',permission:'connected',reminders:{interval:30,daily:10,dwell:5},storageLimit:'5',usedStorageBytes:128000000};
  let refreshTimer;
  const icons={overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',discovery:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/>',settings:'<path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"/><circle cx="12" cy="12" r="3"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>'};
  const svg=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
  const card=(content,extra='')=>`<section class="card ${extra}">${content}</section>`;
  const button=(label,kind='secondary',action='')=>`<button type="button" class="app-btn ${kind} ${action?'':'static-action'}" ${action?`data-action="${action}"`:'tabindex="-1"'}>${label}</button>`;
  const switchControl=(label,on=true)=>`<button type="button" class="switch" role="switch" aria-label="${label}" aria-checked="${on}"><span class="switch-track"></span></button>`;
  const heading=week=>`<div><div class="heading"><h2>${week?'七日观察':'今日观察'}</h2><span class="muted small">${week?'10月8日 — 10月14日':'10月14日'}</span></div><div class="segments"><span class="${week?'':'active'}">今天</span><span>24 小时</span><span class="${week?'active':''}">7 天</span></div></div>`;
  function stats(empty){return `<section><div class="status-line"><i class="dot ${empty?'off':''}"></i><span class="grow">${empty?'未开启 · 0':'采集中 · 3'} 个应用</span><button type="button" class="link" style="border:0;background:none;padding:0;font-size:12px" data-action="settings">设置 ›</button></div><div class="facts"><div><span>浏览作品</span><b>${empty?'0':'48'} 个</b><span>${empty?'0':'63'} 次观看</span></div><div><span>停留时长</span><b>${empty?'—':'42 分'}</b></div></div></section>`}
  function cocoon(empty){
    const paths=Array.from({length:20},(_,i)=>{const n=i/19,a=16+55*n,b=134-55*n;return `<path d="M75 8 C ${a-27} 34 ${a-18} 110 75 137 C ${b+18} 110 ${b+27} 34 75 8"/><path d="M75 8 C ${b+20} 41 ${a-22} 99 75 137"/>`}).join('');
    return card(`<div class="row between"><h4>信息茧房 · 近7天</h4>${empty?'':'<span class="small">暂停</span>'}</div><div class="cocoon-content"><div><svg class="cocoon-drawing" viewBox="0 0 150 144" fill="none" stroke="currentColor" stroke-width=".55" aria-label="信息茧房图形示意" role="img">${paths}</svg></div><div><div class="cocoon-value">${empty?'—':'66.7%'}</div><div class="body-small">观点集中度</div>${empty?'':'<div class="small">远程办公 · 工作方式</div>'}<div class="small muted">${empty?'暂无分析':'18次接触 · 4天'}</div></div></div>${empty?'':'<div class="metric"><span>主要立场</span><span>支持远程办公</span></div><div class="metric"><span>较前7天</span><span>+8.3 个百分点</span></div><div class="metric"><span>同向应用</span><span>2个</span></div>'}<div class="metric"><span>重复依据 · 今天</span><span>${empty?'—':'25.0%'}</span></div>`);
  }
  const words=[['远程办公',8,'high','工作'],['人工智能',6,'high','科技'],['城市通勤',4,'medium','生活'],['效率工具',3,'medium','科技'],['阅读',2,'','生活'],['职业发展',2,'','工作'],['数字生活',1,'','科技']];
  function cloudBody(empty,before){
    if(empty)return '<div class="empty-cloud">暂无关键词</div>';
    if(state.refreshing&&before)return '<div class="empty-cloud" role="status">正在整理近期内容…</div>';
    return `<div class="words">${words.filter(w=>state.category==='全部'||w[3]===state.category).map(([w,n,t])=>`<button type="button" class="word ${t}" ${state.refreshing?'disabled':''} data-word="${w}"><strong>${w}</strong><em>${n}</em></button>`).join('')}</div>`;
  }
  function cloud(empty,before){return card(`<h3 class="cloud-title">近期接触</h3>${empty?'':`<div class="chip-row">${['全部','工作','科技','生活'].map(x=>`<button type="button" class="category ${state.category===x?'selected':''}" data-category="${x}"><span>${x}</span></button>`).join('')}</div>`}<div class="cloud-body">${cloudBody(empty,before)}</div>`,'cloud-card')}
  const start=()=>card(`<h2>暂无记录</h2>${button('设置采集范围','compact','settings')}`);
  const platforms=()=>card('<h4>平台分布</h4>'+[['哔哩哔哩',24,50],['知乎',15,31.25],['小红书',9,18.75]].map(([a,n,w])=>`<div class="row between body-small"><span>${a}</span><span class="muted small">${n} 个作品</span></div><div class="sourcebar"><i style="width:${w}%"></i></div>`).join('')+'<span class="small" style="align-self:flex-end;padding-top:12px">全部记录 ›</span>');
  function overview(before,empty){const a=[heading(false)];if(before)a.push(cocoon(empty),cloud(empty,before),stats(empty));else a.push(...(empty?[start()]:[]),stats(empty),cocoon(empty),cloud(empty,before));if(empty&&before)a.push(start());return a.join('')}
  const counts=[2,5,8,3,6,4,8];
  function trendCard(before){return card(`<h2>浏览趋势</h2><div class="body-small muted selected-date">10/${8+state.selected} · ${counts[state.selected]} 个作品</div><div class="plot-shell"><div class="y-axis"><span>8</span><span>4</span><span>0</span></div><div class="plot-scroll"><div class="plot"><div class="grid-lines"><i></i><i></i><i></i></div>${counts.map((n,i)=>`<button type="button" class="bar-column ${state.selected===i?'selected':''}" aria-pressed="${state.selected===i}" aria-label="10月${i+8}日，${n} 个作品" data-day="${i}"><span class="bar" style="height:${n/8*156}px;--barcolor:${n<=8/3?'#75ae91':n<=16/3?'#d2b967':'#ce817b'}"></span><span class="bar-date">10/${8+i}</span></button>`).join('')}</div></div></div>`)}
  function searchPart(before){const half=Math.ceil(counts[state.selected]/2);return `<section class="column" data-search-section><div><h4>观点分布</h4><div class="muted small selected-date">10/${8+state.selected} · ${counts[state.selected]} 个作品</div></div><div class="stance" aria-label="示例观点立场分布"><i></i><i></i><i></i></div><div class="chip-row"><span class="topic-chip">全部观点 (${counts[state.selected]})</span><span class="topic-chip">远程办公 (${half})</span><span class="topic-chip">人工智能 (${counts[state.selected]-half})</span></div><label class="search">${svg('search')}<input aria-label="搜索观点" placeholder="搜索观点" data-search><span class="search-label">搜索观点</span><button type="button" class="clear-search" aria-label="清除搜索" hidden><span>×</span></button></label><div class="row between"><span class="small">全部 ▾</span><span class="small">全部展开 ⌄</span></div><div class="search-results">${['远程办公','人工智能'].map((x,i)=>`<div class="result-row" data-result="${x}"><b>${x}</b><span class="small muted">${i?counts[state.selected]-half:half} 个作品 ›</span></div>`).join('<div style="height:12px"></div>')}</div><span class="no-results small muted" hidden>无匹配观点</span></section>`}
  const noteSettings=()=>card(`<div class="row between"><h3>录音转文字</h3><span class="small" style="display:flex;align-items:center;min-height:48px">全部记录</span></div><div class="small muted">0 条记录 · 已保存 0 段文字</div><div class="small muted">暂无转写记录</div>`);
  function permission(before){const granted=state.permission!=='missing',connected=state.permission==='connected';if(!before&&granted&&connected)return '<button type="button" class="permission-summary"><span class="grow">系统授权</span><span class="permission-status">已启用</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>';return card(`<h2>系统授权</h2><div class="row between setting-value"><span class="muted">辅助功能授权</span><span>${granted?'已启用':'未检测到'}</span></div><div class="row between setting-value"><span class="muted">辅助服务连接</span><span>${connected?'已连接':'未连接'}</span></div>${button(granted?'查看系统辅助功能授权':'前往系统授权','secondary full')}`,'permission-card')}
  function monitorRow(title,detail,on,before){const copy=`<div class="grow"><div>${title}</div>${detail?`<div class="small muted">${detail}</div>`:''}</div>`;return before?`<div class="monitor-row">${copy}${switchControl(title,on)}</div>`:`<div class="monitor-row" role="switch" tabindex="0" aria-label="${title}${detail?'，'+detail:''}" aria-checked="${on}">${copy}<span class="switch" aria-hidden="true"><span class="switch-track"></span></span></div>`}
  function slider(title,value,min,max,unit,before,setting=''){return `<div><div class="row between small"><span>${title}</span><span class="muted slider-value">${value} ${unit}</span></div><input type="range" class="range" min="${min}" max="${max}" value="${value}" aria-label="${title}" aria-valuetext="${value} ${unit}" data-unit="${unit}" ${setting?`data-reminder-setting="${setting}"`:''}></div>`}
  function moreSettings(before){const fields=slider('提醒间隔',before?30:state.reminders.interval,5,180,'分钟',before,before?'':'interval')+slider('每日提醒上限',before?10:state.reminders.daily,0,30,'次',before,before?'':'daily')+slider('自动提示停留',before?5:state.reminders.dwell,2,8,'秒',before,before?'':'dwell');if(before)return `<div class="more-fields" data-more-anchor>${fields}</div>`;return `<div data-more-anchor><button type="button" class="more-trigger" aria-expanded="false" aria-controls="more-fields"><span>更多</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="more-fields" id="more-fields" hidden>${fields}</div></div>`}
  function monitoring(before){return `<section class="monitor-section" data-monitor><h2>监测与提醒</h2>${monitorRow('云端分析','发送文字；开启画面分析时发送采样画面',true,before)}${monitorRow('实时事实核查','',true,before)}${monitorRow('关键画面分析','',false,before)}${slider('画面采样间隔',30,15,120,'秒',before)}<div class="divider"></div>${monitorRow('悬浮球','',true,before)}${monitorRow('观点重复观察','',true,before)}${monitorRow('专题研究模式','',false,before)}${monitorRow('夜间免打扰','22:00—8:00',true,before)}${moreSettings(before)}<div class="divider"></div><div class="small">今日云端请求 12 次（含画面 0 次）</div>${button('采集工具','text compact')}</section>`}
  function parseStorageDraft(raw){const text=raw.trim();if(text.length<1||text.length>40||!/^(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)$/.test(text))return null;const [whole,fraction='']=text.split('.'),scale=10n**BigInt(fraction.length),digits=BigInt((whole||'0')+fraction),bytesScaled=digits*1000000000n;if(bytesScaled%scale!==0n)return null;const bytes=bytesScaled/scale;if(bytes<100000000n||bytes>9223372036854775807n)return null;const decimals=fraction.replace(/0+$/,'');return {gb:BigInt(whole||'0').toString()+(decimals?'.'+decimals:''),bytes:Number(bytes)}}
  const usedStorageLabel=()=>`${Number((state.usedStorageBytes/1000000).toFixed(1))} MB`;
  function updateStorageDraft(){const input=$('#storage-input'),value=parseStorageDraft(input.value),valid=value!==null,cleanup=valid&&value.bytes<state.usedStorageBytes;$('#storage-save').textContent=cleanup?'保存并清理':'保存';$('#storage-save').disabled=!valid;$('#storage-cleanup-warning').hidden=!cleanup;input.setAttribute('aria-invalid',String(!valid));$('#storage-error').hidden=valid}
  function storage(before){if(before)return card('<h2>本地存储</h2><div class="row between setting-value"><span class="muted">已保存记录</span><span>48 条</span></div><div class="row between setting-value"><span class="muted">保留上限</span><span>5000 条</span></div>'+button('清空全部记录','text compact'),'storage-card');return card(`<h2>本地存储</h2><div class="row between setting-value"><span class="muted">已用空间</span><span class="storage-used-value">${usedStorageLabel()}</span></div><button type="button" class="storage-limit-row" aria-haspopup="dialog" aria-controls="storage-dialog"><span class="muted">容量上限</span><span class="storage-limit-value">${state.storageLimit} GB</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>${button('清空全部记录','text compact')}`,'storage-card')+`<dialog class="storage-dialog" id="storage-dialog" aria-labelledby="storage-limit-label"><form id="storage-form" novalidate><label for="storage-input" id="storage-limit-label">容量上限（GB）</label><input type="text" inputmode="decimal" id="storage-input" value="${state.storageLimit}" aria-invalid="false" aria-describedby="storage-error" required><p class="storage-error" id="storage-error" role="alert" hidden>请输入不小于 0.1 的 GB 数值</p><p class="body-small muted" id="storage-cleanup-warning" hidden>超出上限的最早记录将被删除。</p><div class="row dialog-actions"><button type="button" class="app-btn secondary" id="storage-cancel">取消</button><button type="submit" class="app-btn" id="storage-save">保存</button></div></form></dialog>`}
  function settings(before){const connected=state.permission==='connected';const captureState=connected?'运行中 · 正在记录所选应用':state.permission==='missing'?'已开启 · 等待系统授权':'已开启 · 等待服务连接';const capture=card(`<div class="row"><div class="grow"><div class="row" style="gap:8px"><i class="dot ${connected?'':'off'}"></i><h3>采集开关</h3></div><div class="body-small muted" style="margin-top:4px">${captureState}</div></div>${switchControl('开启采集')}</div>`);const range=card(`<h2>采集范围</h2><div class="small muted">已选择 3 个应用</div><div class="row body-small" style="flex-wrap:wrap"><span>哔哩哔哩</span><span>知乎</span><span>小红书</span></div>${button('选择应用','secondary full')}`);const thumbnails=card(`<div class="row between"><h3>本地缩略图</h3>${switchControl('本地缩略图',false)}</div>`);return `<h2>采集与数据</h2>${capture}${before?noteSettings()+range+thumbnails+monitoring(before)+permission(before):range+permission(before)+noteSettings()+thumbnails+monitoring(before)}${storage(before)}`}
  function discovery(){return `<div class="segments"><span>重复观点 2</span><span class="active">事实核查 3</span></div>${[['个人观点','远程办公比办公室办公更适合我','这是一条关于工作方式的个人偏好。'],['证据不足','换一种工作方式就能提高所有人的效率','现有材料不足以支持面向所有人的结论。'],['尚未核查','人工智能将改变日常工作流程','']].map(([v,c,e])=>`<section class="factcard"><div class="factcontent"><span class="verdict ${v==='个人观点'?'':'neutral'}">${v}</span><p class="factclaim">“${c}”</p>${e?`<p class="body-small muted">${e}</p>`:''}</div><div class="factfooter"><span>查看核查依据</span><span>›</span></div></section>`).join('')}<span class="small" style="padding:12px 4px">全部记录</span>`}
  const notes={empty:['首次使用：采集入口移到页首，基础统计前置；空状态与既有文案保持一致。','对比重点：首屏信息顺序 · 卡片圆角 16 → 20'],overview:['日常概览：先呈现采集状态与接触事实，再进入茧房和近期内容。','对比重点：统计前置 · 次级文字加深 · 近期接触标题与筛选控件统一'],settings:['设置：授权且服务已连接时，系统授权收为一行；未授权或连接异常时，保留完整状态与操作入口。','录音转文字是已有改动，本页仅对比其位置。HTML 无法打开 Android 系统设置或验证读屏效果。'],trend:['局部对比：数量柱形统一为主题蓝色；选中列增加轮廓，列宽至少 48dp。保留横向滚动。','可点击日期、输入搜索词。HTML 点击区按 1px≈1dp 示意；观点内容为简化示例。'],refresh:['局部对比：同一范围刷新时，优化前清空词云；优化后保留当前内容并暂时禁用点击。','模拟延迟固定为 1.4 秒，不代表实际性能。切换范围时仍会重新加载。'],discovery:['发现：页面边距 20 → 16dp，卡片间距 16 → 12dp；正文标题统一至 16sp / 24sp。','核查内容为示例，非真实核查结果。卡片内边距统一为 16dp。']};
  function render(){
    clearTimeout(refreshTimer);state.refreshing=false;
    $$('.scene-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===state.scene)));
    $('#scene-note').textContent=notes[state.scene][0];$('#detail-note').textContent=notes[state.scene][1];$('.note').classList.toggle('settings-note',state.scene==='settings');$('#jump').hidden=state.scene!=='settings';$('#jump-more').hidden=state.scene!=='settings';$('#jump-storage').hidden=state.scene!=='settings';$('#permission-state').hidden=state.scene!=='settings';$('#permission-state').value=state.permission;$('#jump-permission').hidden=state.scene!=='settings';$('#refresh').hidden=state.scene!=='refresh';$('#refresh').disabled=false;$('#refresh').textContent='模拟同范围刷新';
    ['before','after'].forEach(id=>{
      const before=id==='before';let content,screenClass='';
      if(['empty','overview'].includes(state.scene))content=overview(before,state.scene==='empty');
      else if(state.scene==='settings'){content=settings(before);screenClass='settings'}
      else if(state.scene==='trend'){content=trendCard(before)+searchPart(before);screenClass='component'}
      else if(state.scene==='refresh'){content=cloud(false,before)+stats(false);screenClass='component'}
      else {content=discovery();screenClass='discovery'}
      const current=state.scene==='settings'?'settings':state.scene==='discovery'?'discovery':'overview';
      $('#'+id).innerHTML=`<div class="statusbar"><span>9:41</span><span class="statusicons"><svg viewBox="0 0 14 12" fill="currentColor" aria-hidden="true"><path d="M1 10h2V8H1zm4 0h2V6H5zm4 0h2V3H9zm3 0h2V0h-2z"/></svg><svg viewBox="0 0 18 10" fill="none" stroke="currentColor" aria-hidden="true"><rect x="1" y="1" width="14" height="8" rx="1.5"/><path d="M17 3v4"/><rect x="3" y="3" width="10" height="4" fill="currentColor" stroke="none"/></svg></span></div><div class="viewport" tabindex="0" aria-label="${before?'优化前':'优化后'}页面内容"><div class="screen ${screenClass}">${content}</div></div><nav class="nav" aria-label="${before?'优化前':'优化后'}应用导航">${[['overview','概览'],['discovery','发现'],['settings','设置']].map(([k,l])=>`<button type="button" class="${current===k?'active':''}" data-action="${k}">${svg(k)}<span>${l}</span></button>`).join('')}</nav><div class="system-bottom"><span></span></div>`;
    });
    $$('.plot-scroll').forEach(el=>el.scrollLeft=el.scrollWidth);
  }
  function selectScene(scene){state.scene=scene;state.category='全部';render()}
  function refreshCloud(){
    if(state.refreshing)return;state.refreshing=true;$('#before .cloud-card .chip-row').hidden=true;$('#refresh').disabled=true;$('#refresh').textContent='刷新中…';
    $$('.cloud-body').forEach(el=>{const before=Boolean(el.closest('.before'));const height=el.offsetHeight;el.style.height=height+'px';el.innerHTML=cloudBody(false,before);requestAnimationFrame(()=>el.style.height=el.firstElementChild.offsetHeight+'px')});
    refreshTimer=setTimeout(()=>{state.refreshing=false;$('#before .cloud-card .chip-row').hidden=false;$$('.cloud-body').forEach(el=>{el.innerHTML=cloudBody(false,Boolean(el.closest('.before')));el.style.height=el.firstElementChild.offsetHeight+'px'});$('#refresh').disabled=false;$('#refresh').textContent='模拟同范围刷新'},1400);
  }
  document.addEventListener('click',e=>{
    const target=e.target.closest('button,[role="switch"]');if(!target)return;
    if(target.dataset.scene)selectScene(target.dataset.scene);
    else if(target.id==='theme'){state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);target.textContent=state.dark?'浅色预览':'深色预览';target.setAttribute('aria-pressed',String(state.dark))}
    else if(target.id==='jump'){$$('[data-monitor]').forEach(el=>{const view=el.closest('.viewport');view.scrollTop=el.offsetTop-view.offsetTop-16})}
    else if(target.id==='jump-permission'){$$('.permission-card,.permission-summary').forEach(el=>{const view=el.closest('.viewport');view.scrollTop=el.offsetTop-view.offsetTop-16})}
    else if(target.id==='jump-more'){const trigger=$('.more-trigger');if(trigger){trigger.setAttribute('aria-expanded','false');$('#more-fields').hidden=true}$$('[data-more-anchor]').forEach(el=>{const view=el.closest('.viewport');view.scrollTop=el.offsetTop-view.offsetTop-16});trigger?.focus({preventScroll:true})}
    else if(target.id==='jump-storage'){$$('.storage-card').forEach(el=>{const view=el.closest('.viewport');view.scrollTop=el.offsetTop-view.offsetTop-16})}
    else if(target.classList.contains('storage-limit-row')){const input=$('#storage-input');input.value=String(state.storageLimit);input.setAttribute('aria-invalid','false');$('#storage-error').hidden=true;updateStorageDraft();$('#storage-dialog').showModal();input.focus();input.select()}
    else if(target.id==='storage-cancel')$('#storage-dialog').close();
    else if(target.classList.contains('more-trigger')){const expanded=target.getAttribute('aria-expanded')!=='true';target.setAttribute('aria-expanded',String(expanded));$('#more-fields').hidden=!expanded}
    else if(target.id==='refresh')refreshCloud();
    else if(target.dataset.action)selectScene(target.dataset.action);
    else if(target.dataset.day!==undefined){state.selected=Number(target.dataset.day);$$('[data-day]').forEach(b=>{const active=Number(b.dataset.day)===state.selected;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});$$('.selected-date').forEach(el=>el.textContent=`10/${8+state.selected} · ${counts[state.selected]} 个作品`);$$('[data-search-section]').forEach(el=>el.outerHTML=searchPart(Boolean(el.closest('.before'))))}
    else if(target.dataset.category){state.category=target.dataset.category;$$('[data-category]').forEach(b=>b.classList.toggle('selected',b.dataset.category===state.category));$$('.cloud-body').forEach(el=>{el.innerHTML=cloudBody(false,Boolean(el.closest('.before')));el.style.height=''})}
    else if(target.getAttribute('role')==='switch'){target.setAttribute('aria-checked',String(target.getAttribute('aria-checked')!=='true'))}
    else if(target.classList.contains('clear-search')){const input=$('input',target.parentElement);input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}

  });
  document.addEventListener('keydown',e=>{if(e.target.matches('.monitor-row[role=switch]')&&(e.key===' '||e.key==='Enter')){e.preventDefault();e.target.click()}});
  $('#permission-state').addEventListener('change',e=>{state.permission=e.target.value;render()});
  document.addEventListener('submit',e=>{if(e.target.id!=='storage-form')return;e.preventDefault();const input=$('#storage-input'),value=parseStorageDraft(input.value),valid=value!==null;input.setAttribute('aria-invalid',String(!valid));$('#storage-error').hidden=valid;if(!valid){input.focus();return}state.storageLimit=value.gb;state.usedStorageBytes=Math.min(state.usedStorageBytes,value.bytes);$('.storage-limit-value').textContent=value.gb+' GB';$('.storage-used-value').textContent=usedStorageLabel();$('#storage-dialog').close()});
  document.addEventListener('input',e=>{
    if(e.target.id==='storage-input')updateStorageDraft();
    if(e.target.matches('.range')){if(e.target.dataset.reminderSetting)state.reminders[e.target.dataset.reminderSetting]=Number(e.target.value);const value=e.target.value+' '+e.target.dataset.unit;$('.slider-value',e.target.parentElement).textContent=value;e.target.setAttribute('aria-valuetext',value)}
    if(e.target.matches('[data-search]')){const query=e.target.value.trim();$$('[data-search]').forEach(input=>{if(input!==e.target)input.value=e.target.value;$('.clear-search',input.parentElement).hidden=!query;const section=input.closest('section');let count=0;$$('[data-result]',section).forEach(row=>{row.hidden=!row.dataset.result.includes(query);if(!row.hidden)count++});$('.no-results',section).hidden=count>0})}
  });
  render();
})();
</script>
