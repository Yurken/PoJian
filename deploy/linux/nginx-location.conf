# Include inside the deployment domain's existing HTTPS server block.
# This is a route snippet; verify the existing site and valid TLS certificate first.
location = /pojian {
    return 308 /pojian/;
}

location /pojian/ {
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    proxy_pass http://127.0.0.1:28763/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 80s;
    proxy_send_timeout 80s;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log off;
}
