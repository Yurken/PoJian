# Include inside the deployment domain's existing HTTPS server block.
# This is a route snippet; verify the existing site and valid TLS certificate first.
location = /pojian {
    return 308 /pojian/;
}

# Immutable, checksum-verified speech models live outside backend release directories.
location ^~ /pojian/models/ {
    alias /var/www/pojian-models/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
    access_log off;
}

location /pojian/ {
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    proxy_pass http://127.0.0.1:28763/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 80s;
    proxy_send_timeout 80s;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log off;
}
